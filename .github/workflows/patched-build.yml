# Builds the phone app's patched APK, this fork's own copy of Octo: an app
# beside the official one (app.winters.octo.patched), signed with the patched
# key, its updater asleep. Run by hand from the Actions tab, or on every push
# to the fork's branches, the APK is kept as the run's artifact.
#
# The patched key comes from four secrets: OCTO_PATCHED_KEYSTORE_BASE64 (the
# keystore file, base64), OCTO_PATCHED_KEYSTORE_PASSWORD, OCTO_PATCHED_KEY_ALIAS
# and OCTO_PATCHED_KEY_PASSWORD. Every patched build must use the same key, or
# phones refuse the update. The key itself never enters this repository.
#
# A run started by hand also passes the Brama (the Elephant's Gate): the brama
# job below, which stands the patched APK beside the official 1.11.0 on an
# emulator that talks to an octo bridge raised on the runner itself (octo, the
# yt-dlp shim and a real Navidrome -- the live-smoke job's stack), and walks
# the W1-W8 runtime checks of the find-in-playlists patch. A push only builds:
# the Brama runs on dispatch alone. It needs no secrets of its own; the images
# and the official APK are public.
name: patched-build

on:
  # The APK builds on the Admiral's order alone (fleet law §5): a push —
  # code, docs, anything — never starts a build by itself.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release below carries the APK to the Releases page
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit count is the version code, so every build counts up.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Build number
        run: |
          echo "OCTO_BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          ver=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null | sed 's/^v//')
          echo "OCTO_VERSION=${ver:-0.2.0}" >> "$GITHUB_ENV"

      - name: Tests
        run: ./gradlew :shared:core:allTests :app:testDebugUnitTest --no-daemon

      - name: Patched key
        env:
          KEYSTORE: ${{ secrets.OCTO_PATCHED_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::OCTO_PATCHED_KEYSTORE_BASE64 is not set in this repository's secrets."; exit 1; fi
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/octo-patched.jks"
          echo "OCTO_PATCHED_KEYSTORE=$RUNNER_TEMP/octo-patched.jks" >> "$GITHUB_ENV"

      - name: Signed APK
        env:
          OCTO_PATCHED_KEYSTORE_PASSWORD: ${{ secrets.OCTO_PATCHED_KEYSTORE_PASSWORD }}
          OCTO_PATCHED_KEY_ALIAS: ${{ secrets.OCTO_PATCHED_KEY_ALIAS }}
          OCTO_PATCHED_KEY_PASSWORD: ${{ secrets.OCTO_PATCHED_KEY_PASSWORD }}
        run: ./gradlew :app:assemblePatched -PoctoBuild=${OCTO_BUILD} -PoctoAndroidVersion=${OCTO_VERSION} --no-daemon

      - name: The APK is signed
        run: |
          apk=app/build/outputs/apk/patched/app-patched.apk
          if [ ! -f "$apk" ]; then echo "::error::No signed APK: the patched key did not reach the build."; exit 1; fi
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$tools/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
          grep "certificate SHA-256 digest" "$RUNNER_TEMP/certs.txt"
          {
            echo "### Octo for Android (patched)"
            echo
            echo '```'
            grep "certificate SHA-256 digest" "$RUNNER_TEMP/certs.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/octo-patched.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: octo-android-patched
          path: app/build/outputs/apk/patched/app-patched.apk
          if-no-files-found: error
      # The Releases page always carries the fleet's APK under the same tag
      # and the same file name, Octo-patched.apk, so the link never changes;
      # the app's version lives inside the APK and in the release notes.
      - name: Put the APK on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete patched-latest --cleanup-tag -y 2>/dev/null || true
          for old in $(gh release list --json tagName --jq '.[].tagName' | grep '^patched-v'); do
            gh release delete "$old" --cleanup-tag -y 2>/dev/null || true
          done
          cp app/build/outputs/apk/patched/app-patched.apk Octo-patched.apk
          gh release create patched-latest Octo-patched.apk -R "$GITHUB_REPOSITORY" \
            --title "Octo Player patched (fleet build)" \
            --notes "The fleet's own build of the fork: upstream's own code in full, beside the official app, signed with the fleet key, which never changes, so this installs right over any older fleet build. Songs found online in playlists need Octo server 2026.11.15. App version ${OCTO_VERSION} (build ${OCTO_BUILD}), commit ${GITHUB_SHA}, CI run ${GITHUB_RUN_ID}."

  # The Brama: the patched APK from this run's artifact, beside the official
  # 1.11.0, on an emulator that talks to an octo bridge standing on the runner
  # itself. The bridge is the live-smoke job's stack -- octo, the yt-dlp shim
  # and a real Navidrome -- started with docker run on a network of their own
  # rather than the server repo's full compose stack, which would drag slskd
  # and octo-sonic in for nothing the gate reads. Every W step asserts on
  # state: uiautomator dumps, pm list packages, REST probes against the
  # bridge, logcat -- never pixels. One boundary is deliberate: streaming a
  # found song from a datacenter IP always meets YouTube's bot wall (the
  # live-smoke chronicle), so the gate proves the find lands and syncs, and
  # playback itself belongs to the SOAK on a residential phone.
  brama:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Everything the W steps share; not a secret among them.
      BRAMA_RUN: brama-${{ github.run_id }}
      OCTO_PORT: "5274"
      OFFICIAL_APK: https://github.com/winters27/octo/releases/download/android-v1.11.0/Octo-1.11.0-android.apk

    steps:
      # The runner's Android SDK is not on the PATH, and adb bare-named is
      # what every later step of this job speaks (run 43851307242 died on
      # `adb: command not found`). Every step after this one finds adb, the
      # emulator and the sdkmanager's tools by name, and the AVDs live where
      # both avdmanager and the emulator look (run 3's create wrote its .ini
      # where the emulator never looked).
      - name: The Android tools on the PATH
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android/avd"
          # The PATH written above only reaches the NEXT steps, so this proof
          # names adb by its full path: the bare name would die with 127 here
          # (run 43858067710) and skip the whole walk.
          "$ANDROID_HOME/platform-tools/adb" version

      - name: The fork, for the boundary check
        uses: actions/checkout@v7
        with:
          # W8 diffs origin/main..HEAD, so both sides' history has to be here.
          fetch-depth: 0

      - name: The patched APK from this run's build
        uses: actions/download-artifact@v8
        with:
          name: octo-android-patched

      # The bridge stack, after live-smoke.sh in the octo repo: a network,
      # Navidrome with a self-made admin, the shim, and Octo pointing at both.
      # Three sine tones, tagged by ffmpeg, give the library real songs -- two
      # of them named for Mozart, so one search answers library rows and found
      # songs together. The family side of the fork is switched on and given
      # its #family prefix through the dashboard's own API, exactly as the
      # earlier expedition's family gate did; the found songs' titles come
      # from Octo's own search3 answer, which is the shape the app sees.
      - name: The bridge stack
        run: |
          set -euo pipefail
          # The runner images no longer carry ffmpeg, and the library tones
          # need it; the apt build is enough for lavfi sines and tagging.
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          PW="brama-$BRAMA_RUN-pass"
          PW_HEX="$(printf '%s' "$PW" | od -An -tx1 | tr -d ' \n')"
          MUSIC="$(mktemp -d)/music"
          mkdir -p "$MUSIC"
          i=1
          for tone in "Mozart Bridge One 440" "Mozart Bridge Two 550" "Bridge Tone Three 660"; do
            set -- $tone
            title="$1 $2 $3"; freq="$4"
            ffmpeg -loglevel error -f lavfi -i "sine=frequency=$freq:duration=30" \
              -metadata title="$title" -metadata artist="Bridge Artist" -metadata album="Bridge Album" \
              "$MUSIC/tone$i.mp3"
            i=$((i+1))
          done

          docker network create "$BRAMA_RUN-net"
          docker run -d --name "$BRAMA_RUN-navidrome" --network "$BRAMA_RUN-net" \
            -e "ND_DEVAUTOCREATEADMINPASSWORD=$PW" \
            -v "$MUSIC:/music" deluan/navidrome:latest
          docker run -d --name "$BRAMA_RUN-shim" --network "$BRAMA_RUN-net" \
            ghcr.io/epixdonkey/octo-yt-dlp-shim:dev
          docker run -d --name "$BRAMA_RUN-octo" --network "$BRAMA_RUN-net" \
            -p "127.0.0.1:$OCTO_PORT:8080" \
            -e "Subsonic__Url=http://$BRAMA_RUN-navidrome:4533" \
            -e "Subsonic__AdminUsername=admin" \
            -e "Subsonic__AdminPassword=$PW" \
            -e "Subsonic__StorageMode=Stream" \
            -e "Subsonic__EnableSearchDiscovery=true" \
            -e "YouTube__ShimUrl=http://$BRAMA_RUN-shim:8080" \
            -v "$MUSIC:/music" \
            ghcr.io/epixdonkey/octo:dev

          base="http://localhost:$OCTO_PORT"
          auth="u=admin&p=enc:$PW_HEX&v=1.16.1&c=brama&f=json"
          for i in $(seq 1 60); do
            curl -fsS --max-time 5 "$base/rest/ping.view?$auth" >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS "$base/rest/ping.view?$auth" | jq -e '.["subsonic-response"].status == "ok"' >/dev/null

          # Navidrome scans the folder at start; the tones must be findable
          # before the gate can stand them beside found songs.
          n=0
          for i in $(seq 1 90); do
            n="$(curl -fsS "$base/rest/search3.view?query=Mozart%20Bridge&artistCount=0&albumCount=0&songCount=20&$auth" \
              | jq '.["subsonic-response"].searchResult3.song // [] | length' 2>/dev/null || echo 0)"
            [ "$n" -ge 2 ] 2>/dev/null && break
            sleep 2
          done
          [ "$n" -ge 2 ] 2>/dev/null || { echo "::error::Navidrome never indexed the tones."; docker logs "$BRAMA_RUN-navidrome" 2>&1 | tail -20; exit 1; }
          LIB1="$(curl -fsS "$base/rest/search3.view?query=Mozart%20Bridge%20One&artistCount=0&albumCount=0&songCount=5&$auth" \
            | jq -r '.["subsonic-response"].searchResult3.song[0].id')"
          LIB2="$(curl -fsS "$base/rest/search3.view?query=Mozart%20Bridge%20Two&artistCount=0&albumCount=0&songCount=5&$auth" \
            | jq -r '.["subsonic-response"].searchResult3.song[0].id')"

          # An existing library playlist, for W2's "into an existing one".
          W2_NAME="Biblioteczna $BRAMA_RUN"
          W2_ID="$(curl -fsS "$base/rest/createPlaylist.view?name=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$W2_NAME")&songId=$LIB1&songId=$LIB2&$auth" \
            | jq -r '.["subsonic-response"].playlist.id')"

          # Octo's own search3 answer names the found rows -- the same answer
          # the app's search reads. Discovery asks the shim, which searches
          # live YouTube fine from a datacenter IP; only /stream is walled.
          SEARCH=""
          for i in $(seq 1 45); do
            SEARCH="$(curl -fsS --max-time 90 "$base/rest/search3.view?query=Mozart&artistCount=0&albumCount=0&songCount=30&$auth" || true)"
            found="$(jq '[.["subsonic-response"].searchResult3.song // [] | .[] | select(.isExternal == true)] | length' <<<"$SEARCH" 2>/dev/null || echo 0)"
            [ "${found:-0}" -ge 2 ] 2>/dev/null && break
            sleep 3
          done
          if [ "${found:-0}" -lt 2 ] 2>/dev/null; then
            echo "::error::Octo's search3 answered fewer than two outside songs. Answer: ${SEARCH:0:600}"
            exit 1
          fi
          F1_TITLE="$(jq -r '[.["subsonic-response"].searchResult3.song[] | select(.isExternal == true)][0].title' <<<"$SEARCH")"
          F2_TITLE="$(jq -r '[.["subsonic-response"].searchResult3.song[] | select(.isExternal == true)][1].title' <<<"$SEARCH")"

          # Family on, with its #family prefix, through the dashboard's API.
          jar="$RUNNER_TEMP/brama-family.jar"
          curl -fsS -c "$jar" -X POST "$base/api/family/auth" -H 'Content-Type: application/json' -H 'X-Octo-Family: 1' \
            -d "{\"username\":\"admin\",\"password\":\"$PW\"}" >/dev/null
          curl -fsS -b "$jar" -X POST "$base/api/family/enable" -H 'Content-Type: application/json' -H 'X-Octo-Family: 1' \
            -d '{"enabled":true}' | jq -e '.enabled == true' >/dev/null
          curl -fsS -b "$jar" -X POST "$base/api/family/playlist-prefix" -H 'Content-Type: application/json' -H 'X-Octo-Family: 1' \
            -d '{"prefix":"#family"}' | jq -e '.playlistPrefix == "#family"' >/dev/null

          {
            echo "BRAMA_PASS=$PW"
            echo "BRAMA_AUTH=$auth"
            echo "BRAMA_BASE=$base"
            echo "W2_NAME=$W2_NAME"
            echo "W2_ID=$W2_ID"
            echo "F1_TITLE=$F1_TITLE"
            echo "F2_TITLE=$F2_TITLE"
            echo "LIB1_ID=$LIB1"
            echo "LIB2_ID=$LIB2"
          } >> "$GITHUB_ENV"
          echo "Bridge up: playlist $W2_ID ($W2_NAME); found rows: $F1_TITLE / $F2_TITLE"

      # The emulator, with the SDK's own tools, because the gate's spec pins
      # the image: system-images;android-36;google_apis;x86_64 through
      # sdkmanager, an AVD of a pixel, KVM on, boot waited out. The runner
      # already carries the emulator and platform-tools; only the image is
      # missing. The reactive-circus action would bring its own SDK setup and
      # its own api-level opinion; this way the image is exactly the spec's.
      - name: The emulator
        run: |
          set -euo pipefail
          [ -e /dev/kvm ] || { echo "::error::This runner exposes no /dev/kvm; the gate cannot run an emulator here."; exit 1; }
          # The device existing is not the same as this user being allowed
          # into it: run 43870530955's emulator refused to start with "This
          # user doesn't have permissions to use KVM" while the runner user
          # sat outside the kvm group. Opening the device to the session is
          # the standard CI answer; adding the user to the group would not
          # reach the already-running process.
          sudo chmod 666 /dev/kvm
          # No `yes |` here: sdkmanager does not read standard input, and a
          # producer piping into it dies of the broken pipe under pipefail
          # even when the install itself succeeded. The runner image ships
          # the licences already accepted. The tools answer by name: the
          # first step of this job put the SDK on the PATH, and the AVD home
          # is pinned there too, so avdmanager and the emulator agree on
          # where the AVD lives.
          # The image download is as flaky as any other (run 43890190905: the
          # SDK package came down cut off -- "Premature EOF" -- after four
          # green runs), so it gets the same retries as the APK download.
          image_ok=""
          for i in 1 2 3; do
            sdkmanager --install "system-images;android-36;google_apis;x86_64" >/dev/null && { image_ok=1; break; }
            sleep 10
          done
          [ -n "$image_ok" ] || { echo "::error::The system image did not come down in three tries."; exit 1; }
          echo no | avdmanager create avd --force -n "$BRAMA_RUN" \
            -k "system-images;android-36;google_apis;x86_64" --device pixel
          [ -f "$ANDROID_AVD_HOME/$BRAMA_RUN.ini" ] || {
            echo "::error::avdmanager wrote no $BRAMA_RUN.ini under $ANDROID_AVD_HOME."
            avdmanager list avd
            exit 1
          }
          nohup emulator -avd "$BRAMA_RUN" \
            -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -accel on \
            -memory 3072 -no-snapshot > "$RUNNER_TEMP/emulator.log" 2>&1 &
          # A deadline on the device showing up at all; wait-for-device by
          # itself would sit quiet to the job's timeout if the process died.
          seen=""
          for i in $(seq 1 60); do
            if adb devices | grep -q "emulator-"; then seen=1; break; fi
            sleep 2
          done
          [ -n "$seen" ] || { echo "::error::The emulator never showed up in adb."; tail -40 "$RUNNER_TEMP/emulator.log"; exit 1; }
          adb wait-for-device
          boot=""
          for i in $(seq 1 300); do
            boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            [ "$boot" = "1" ] && break
            sleep 2
          done
          [ "$boot" = "1" ] || { echo "::error::The emulator never finished booting."; tail -40 "$RUNNER_TEMP/emulator.log"; exit 1; }
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard 2>/dev/null || true
          adb devices

      # What the W steps share: a dump-and-tap helper over uiautomator, a
      # Subsonic probe against the bridge, a verdict per line. State, never
      # pixels: every tap lands on the centre of a node the dump names.
      - name: The gate's helpers
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/brama-shots" "$RUNNER_TEMP/brama-dumps"
          cat > "$RUNNER_TEMP/brama-lib.sh" <<'LIB'
          set -u
          PASS=0; FAIL=0
          APP=app.winters.octo.patched

          check() { # check <step> <what> <expected> <actual>
            if [[ "$4" == *"$3"* ]]; then
              PASS=$((PASS+1)); echo "[$1] PASS: $2"
              echo "| $1 | PASS | $2 |" >> "$RUNNER_TEMP/wtable.md"
            else
              FAIL=$((FAIL+1)); echo "[$1] FAIL: $2 -- expected \"$3\", got: ${4:0:300}"
              echo "| $1 | FAIL | $2 |" >> "$RUNNER_TEMP/wtable.md"
            fi
          }
          verdict() {
            echo "[$1] $PASS passed, $FAIL failed"
            [ "$FAIL" -eq 0 ]
          }

          dump() { # dump <name> -> a fresh uiautomator dump, under that name; never silent
            local i ok=""
            for i in 1 2 3; do
              adb shell uiautomator dump /sdcard/brama.xml >/dev/null 2>&1 || { sleep 2; continue; }
              adb pull /sdcard/brama.xml "$RUNNER_TEMP/brama-dumps/$1.xml" >/dev/null 2>&1 || { sleep 2; continue; }
              ok=1; break
            done
            if [ -z "$ok" ]; then
              adb exec-out screencap -p > "$RUNNER_TEMP/brama-shots/$1-dump-failed.png" 2>/dev/null || true
              echo "::error::The screen dump $1 never came down in three tries."
              exit 1
            fi
            echo "$RUNNER_TEMP/brama-dumps/$1.xml"
          }
          screen_texts() { # screen_texts <name> -> every text and content-desc, entities decoded
            [ -f "$RUNNER_TEMP/brama-dumps/$1.xml" ] || dump "$1" >/dev/null
            python3 - "$RUNNER_TEMP/brama-dumps/$1.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          for node in root.iter("node"):
              for value in (node.get("text"), node.get("content-desc")):
                  if value:
                      print(value)
          PY
          }
          # A shot is evidence, never a gate: if it cannot be taken, the
          # assertion it stood beside still speaks.
          shot() { adb exec-out screencap -p > "$RUNNER_TEMP/brama-shots/$1.png" 2>/dev/null || true; }
          swipe_up() { adb shell input swipe 540 1500 540 500 300; }
          # The user never kills the app to look at it, and neither may the
          # gate: run 43898136604's search step force-stopped the freshly
          # signed-in app, and after the kill the session never came back in
          # the window -- no search3 left the phone, the library copy stayed
          # empty, and the search said "No results". Bringing the activity
          # forward leaves the session and the copy alone.
          launch() {
            adb shell am start -n $APP/app.winters.octo.MainActivity >/dev/null \
              || { echo "::error::The patched app would not come forward."; exit 1; }
            sleep 3
          }
          # Home by preference, BACK only in need: a blind BACK walk landed
          # on Settings (run 44101841939: the picker left a stack behind),
          # and BACK from the main shell leaves the app altogether. When
          # the bottom bar answers, its Home tab is tapped -- exact and
          # clickable, and the run's own dump shows it reachable even from
          # Settings -- and the page proves itself by its own words. Only a
          # screen without the bar (a full dialog) gets BACK, two at most,
          # and then the bar is looked for again.
          back_to_main() {
            local i backs=0 home
            for i in 1 2 3 4 5; do
              dump back >/dev/null
              cp "$RUNNER_TEMP/brama-dumps/back.xml" "$RUNNER_TEMP/brama-dumps/tap.xml"
              home="$(nodes_with "Home" tap)"
              if [ -n "$home" ]; then
                adb shell input tap $home
                sleep 2
                await_text "Edit Home" 8 && { sleep 1; return 0; }
              elif [ "$backs" -lt 2 ]; then
                adb shell input keyevent 4
                backs=$((backs+1))
                sleep 1
              else
                return 1
              fi
            done
            return 1
          }

          # A match must be usable, not just exact (run 43937576296: the form
          # carries TWO "Sign in" nodes -- the app bar's title, sometimes
          # dumped high up, and the submit button; the first-in-document won
          # and the tap landed in the bar). Modes: "tap" wants the node or an
          # ancestor (six levels up) clickable and the bounds fully on screen;
          # "read" takes any node; "read-onscreen" also needs the bounds on
          # screen. An exact match always beats a substring, and a usable
          # match always beats an unusable one.
          nodes_with() { # nodes_with <text> [tap|read|read-onscreen]
            python3 - "$RUNNER_TEMP/brama-dumps/tap.xml" "$1" "${2:-read}" <<'PY'
          import sys, re, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          want, mode = sys.argv[2], sys.argv[3]
          m = re.match(r"\[(-?\d+),(-?\d+)\]\[(-?\d+),(-?\d+)\]", root.get("bounds", "") or "")
          W, H = (int(m.group(3)), int(m.group(4))) if m else (10**9, 10**9)
          parents = {}
          def walk(node, parent):
              parents[node] = parent
              for child in node:
                  walk(child, node)
          walk(root, None)
          def rect(node):
              mm = re.match(r"\[(-?\d+),(-?\d+)\]\[(-?\d+),(-?\d+)\]", node.get("bounds", ""))
              return tuple(map(int, mm.groups())) if mm else None
          def usable(node):
              r = rect(node)
              if not r or not (r[0] < r[2] and r[1] < r[3]):
                  return False
              if mode != "read" and not (r[0] >= 0 and r[1] >= 0 and r[2] <= W and r[3] <= H):
                  return False
              if mode == "tap":
                  n = node
                  for _ in range(7):
                      if n is None:
                          break
                      if n.get("clickable") == "true":
                          # A disabled button taps nowhere (run 44003221446:
                          # Create stayed disabled over an empty field), so a
                          # disabled clickable ancestor does not count.
                          return n.get("enabled", "true") == "true"
                      n = parents.get(n)
                  return False
              return True
          exact = sub = None
          for node in root.iter("node"):
              for value in (node.get("text"), node.get("content-desc")):
                  if not value:
                      continue
                  r = rect(node)
                  if not r:
                      continue
                  c = ((r[0] + r[2]) // 2, (r[1] + r[3]) // 2)
                  if value == want:
                      if usable(node):
                          print(*c)
                          sys.exit(0)
                      if exact is None:
                          exact = c
                  elif want in value and sub is None and usable(node):
                      sub = c
          if sub:
              print(*sub)
          elif mode == "read" and exact:
              print(*exact)
          PY
          }
          await_text() { # await_text <text> [tries [scroll]]
            local i mode
            mode="read"; [ "${3:-}" = scroll ] && mode="read-onscreen"
            for i in $(seq 1 "${2:-20}"); do
              dump await >/dev/null
              cp "$RUNNER_TEMP/brama-dumps/await.xml" "$RUNNER_TEMP/brama-dumps/tap.xml"
              if [ -n "$(nodes_with "$1" "$mode")" ]; then return 0; fi
              [ "${3:-}" = scroll ] && swipe_up
              sleep 2
            done
            return 1
          }
          tap_text() { # tap_text <text> -> taps the centre of the first node naming it
            dump tap >/dev/null
            local xy; xy="$(nodes_with "$1" tap)"
            [ -n "$xy" ] && adb shell input tap $xy && return 0
            return 1
          }
          tap_edit() { # tap_edit <index> -> taps the index-th text field on screen
            local xy
            dump edit >/dev/null
            xy="$(python3 - "$RUNNER_TEMP/brama-dumps/edit.xml" "$1" <<'PY'
          import sys, re, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          want = int(sys.argv[2])
          fields = [n for n in root.iter("node") if n.get("class") == "android.widget.EditText"]
          if want < len(fields):
              m = re.match(r"\[(-?\d+),(-?\d+)\]\[(-?\d+),(-?\d+)\]", fields[want].get("bounds", ""))
              if m:
                  x1, y1, x2, y2 = map(int, m.groups())
                  print((x1 + x2) // 2, (y1 + y2) // 2)
          PY
          )"
            [ -n "$xy" ] && adb shell input tap $xy && return 0
            return 1
          }
          type() { adb shell input text "${1// /%s}"; }
          edit_state() { # edit_state <index> -> "<focused> <text>" of that text field
            python3 - "$RUNNER_TEMP/brama-dumps/typecheck.xml" "$1" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          fields = [n for n in root.iter("node") if n.get("class") == "android.widget.EditText"]
          i = int(sys.argv[2])
          if i < len(fields):
              print(fields[i].get("focused"), (fields[i].get("text") or "").strip())
          PY
          }
          # Typing is proven, not assumed (run 44003221446: the field sat
          # empty after the tap -- the dialog's animation had stolen the
          # focus -- and the text went nowhere). Tap the field, prove it is
          # focused, type, prove the text landed; three tries, then loud.
          # Verification modes: "full" (default) proves the text itself --
          # honest for open fields; "length" proves the field answered with
          # something, which is all a masked password can show (run
          # 44006078459: the dots never spell the password, and the check
          # died on its own mask); "none" trusts the focus alone.
          type_into() { # type_into <index> <text> [shot-tag] [full|length|none]
            local idx="$1" want="$2" tag="${3:-field}" verify="${4:-full}" i ok="" state text
            for i in 1 2 3; do
              tap_edit "$idx" || { sleep 1; continue; }
              dump typecheck >/dev/null
              state="$(edit_state "$idx")"
              [ "$(awk '{print $1}' <<<"$state")" = "true" ] || { sleep 1; continue; }
              type "$want"
              [ "$verify" = "none" ] && { ok=1; break; }
              dump typecheck >/dev/null
              state="$(edit_state "$idx")"
              text="${state#true }"
              if [ "$verify" = "full" ]; then
                grep -qF "$want" <<<"$text" && { ok=1; break; }
              elif [ "$verify" = "length" ]; then
                [ -n "$text" ] && { ok=1; break; }
              fi
              sleep 1
            done
            [ -n "$ok" ] || { shot "$tag-empty"; echo "::error::The field never took the text \"$want\"."; exit 1; }
          }
          longpress() { # longpress <text> -> a 700 ms press on the row's centre
            dump press >/dev/null
            cp "$RUNNER_TEMP/brama-dumps/press.xml" "$RUNNER_TEMP/brama-dumps/tap.xml"
            local xy; xy="$(nodes_with "$1" tap)"
            [ -n "$xy" ] && adb shell input swipe $xy $xy 700 && return 0
            return 1
          }
          open_menu_on_row() {
            local i
            for i in 1 2 3; do
              longpress "$1" && sleep 1 && return 0
              swipe_up; sleep 1
            done
            return 1
          }
          # Switch reading and flipping, from dumps that belong to the call
          # alone: every read takes its own fresh dump under its own name
          # (sw-state-N / sw-flip-N), so no other helper's file can speak
          # for the switch, and the switch is flipped at most once per look
          # (run 44098011463: a stale read said "off" after the flip, the
          # second flip turned it off again, and the step failed its own
          # doing). The tap lands on the switch's thumb: eighty pixels from
          # the matched node's right end, on its centre line -- the switch's
          # own onCheckedChange, where the row's middle proved dead (run
          # 44094336562).
          switch_state() { # switch_state <xml-file> <row text> -> "on", "x y", or empty
            python3 - "$1" "$2" <<'PY'
          import sys, re, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          want = sys.argv[2]
          # Two shapes, most trusted first: a checkable right of the text,
          # then one overlapping the row from the left.
          row = None
          for node in root.iter("node"):
              for value in (node.get("text"), node.get("content-desc")):
                  if value and want in value:
                      m = re.match(r"\[(-?\d+),(-?\d+)\]\[(-?\d+),(-?\d+)\]", node.get("bounds", ""))
                      if m:
                          row = tuple(map(int, m.groups()))
                          break
          if row is None:
              sys.exit(0)
          right = None
          overlap = None
          for node in root.iter("node"):
              if node.get("checkable") != "true":
                  continue
              m = re.match(r"\[(-?\d+),(-?\d+)\]\[(-?\d+),(-?\d+)\]", node.get("bounds", ""))
              if not m:
                  continue
              x1, y1, x2, y2 = map(int, m.groups())
              cy = (y1 + y2) // 2
              if row[1] - 20 <= cy <= row[3] + 20:
                  c = (node, (x2 - 80, cy))
                  if x1 > row[0] and right is None:
                      right = c
                  if x1 <= row[2] and x2 >= row[0] and overlap is None:
                      overlap = c
          best = right or overlap
          if best:
              node, (x, y) = best
              if node.get("checked") == "true":
                  print("on")
              else:
                  print(x, y)
          PY
          }
          switch_on_beside() { # switch_on_beside <row text> -> "on" (flipped once if off), "fail", or empty (row nowhere)
            local want="$1" i st
            for i in 1 2 3; do
              dump "sw-state-$i" >/dev/null
              st="$(switch_state "$RUNNER_TEMP/brama-dumps/sw-state-$i.xml" "$want")"
              [ -n "$st" ] || { echo ""; return 0; }
              if [ "$st" = "on" ]; then echo "on"; return 0; fi
              adb shell input tap $st
              sleep 2
              dump "sw-flip-$i" >/dev/null
              st="$(switch_state "$RUNNER_TEMP/brama-dumps/sw-flip-$i.xml" "$want")"
              [ "$st" = "on" ] && { echo "on"; return 0; }
            done
            echo "fail"
          }
          # The sign-in form's Legacy row: flip it on, once, proven from
          # dumps of its own.
          toggle_beside() { # toggle_beside <row text> -> 0 when the switch is on (flipping once if off)
            local want="$1" st
            dump tgl-state >/dev/null
            st="$(switch_state "$RUNNER_TEMP/brama-dumps/tgl-state.xml" "$want")"
            [ -n "$st" ] || return 1
            [ "$st" = "on" ] && return 0
            adb shell input tap $st
            sleep 2
            dump tgl-flip >/dev/null
            st="$(switch_state "$RUNNER_TEMP/brama-dumps/tgl-flip.xml" "$want")"
            [ "$st" = "on" ]
          }
          # The lowest clickable node on screen: the now playing bar, when
          # nothing else names it.
          tap_bottom() {
            dump bottom >/dev/null
            local xy; xy="$(python3 - "$RUNNER_TEMP/brama-dumps/bottom.xml" <<'PY'
          import sys, re, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          best = None
          for node in root.iter("node"):
              if node.get("clickable") == "true":
                  m = re.match(r"\[(-?\d+),(-?\d+)\]\[(-?\d+),(-?\d+)\]", node.get("bounds", ""))
                  if not m:
                      continue
                  x1, y1, x2, y2 = map(int, m.groups())
                  c = ((x1 + x2) // 2, (y1 + y2) // 2)
                  if best is None or c[1] > best[1]:
                      best = c
          if best:
              print(*best)
          PY
          )"
            [ -n "$xy" ] && adb shell input tap $xy && return 0
            return 1
          }

          sub() { # sub <endpoint-query> -> the bridge's JSON answer, empty on error
            curl -fsS --max-time 60 "$BRAMA_BASE/rest/$1&$BRAMA_AUTH" 2>/dev/null || true
          }
          urlenc() { python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$1"; }
          playlist_id_by_name() { # playlist_id_by_name <name> -> the first matching id, or nothing
            sub "getPlaylists.view?" | jq -r --arg n "$1" \
              '[.["subsonic-response"].playlists.playlist[]? | select(.name == $n) | .id][0] // empty'
          }
          playlist_entry_count() { # playlist_entry_count <id> -> songCount, or api-error
            local body v
            body="$(sub "getPlaylist.view?id=$1&")"
            v="$(jq -r 'if .["subsonic-response"].error or (.["subsonic-response"].playlist == null) then empty
                        else (.["subsonic-response"].playlist.songCount // (.["subsonic-response"].playlist.entry | length)) end' <<<"$body" 2>/dev/null)"
            [ -n "$v" ] || v="api-error"
            echo "$v"
          }
          playlist_external_count() { # playlist_external_count <id> -> found rows, or api-error
            local body v
            body="$(sub "getPlaylist.view?id=$1&")"
            v="$(jq -r 'if .["subsonic-response"].error or (.["subsonic-response"].playlist == null) then empty
                        else ([.["subsonic-response"].playlist.entry // [] | .[] | select(.isExternal == true)] | length) end' <<<"$body" 2>/dev/null)"
            [ -n "$v" ] || v="api-error"
            echo "$v"
          }
          # A probe with patience: the app's sync waits out its own 1.5 s
          # debounce before it sends, so a count read right after a tap races
          # it. Poll the counter until it answers the expectation, and let
          # the check fail on the last value seen when it never does.
          await_count() { # await_count <expected> <counter command...>
            local want="$1"; shift
            local v="" i
            for i in $(seq 1 8); do
              v="$("$@" 2>/dev/null)"
              [ "$v" = "$want" ] && { echo "$v"; return 0; }
              sleep 2
            done
            echo "${v:-none}"
            return 1
          }
          await_id() { # await_id <name> -> the playlist's id; loud when the server never lists it
            local i id
            for i in $(seq 1 8); do
              id="$(playlist_id_by_name "$1")"
              [ -n "$id" ] && { echo "$id"; return 0; }
              sleep 2
            done
            shot "no-id-${1// /-}"
            echo "::error::The server never answered the id of playlist \"$1\" (run 44080662051 died here in silence)." >&2
            exit 1
          }

          # The walks the steps share: open the app's search, and reach the
          # playlists page under the Library tab.
          search_for() { # search_for <query>
            launch
            tap_text "Search" || tap_edit 0
            sleep 2
            # A search on a dead session answers nothing (runs 43898136604
            # and 43933032189): the empty screen itself says when no server
            # is signed in, and that must be caught before anything is typed.
            dump search-session >/dev/null
            if grep -q "Search the music on your phone" "$RUNNER_TEMP/brama-dumps/search-session.xml"; then
              shot search-signed-out
              echo "::error::The search screen says the phone is signed out; the session is dead."
              exit 1
            fi
            tap_edit 0 || tap_text "Search songs, albums, artists"
            type "$1"
            adb shell input keyevent 66
            sleep 8
          }
          open_playlists() {
            tap_text "Library" || { shot lib-library; echo "::error::The Library could not be tapped."; exit 1; }
            sleep 2
            dump open-lib-1 >/dev/null
            await_text "Playlists" 10 scroll \
              || { shot open-playlists; echo "::error::The Library's Playlists entry never appeared."; exit 1; }
            tap_text "Playlists" || { shot lib-playlists; echo "::error::The Playlists could not be tapped."; exit 1; }
            sleep 2
            dump open-playlists-1 >/dev/null
          }
          LIB

      # W6 (R5): the official 1.11.0 from the developer's own release (the
      # same APK the developer's F-Droid repository indexes), installed first;
      # then the patched APK from this run's artifact, beside it, without a
      # conflict; the official app still starts on its own sign-in page, its
      # data untouched.
      - name: W6 - the patched APK beside the official one
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/brama-lib.sh"
          # The developer's release answered a transient HTTP error once (run
          # 43881317753; the asset is there and rebuilt releases are their
          # habit), so the download retries hard and then proves the file
          # against the release's own SHA256SUMS -- a cut-off or re-meaned
          # asset must fail loudly, not install. The helpers this step now
          # shares with the walk give the screen dump its own retries and its
          # own loud failure (run 43885621408 died on a bare dump with no
          # word, both installs already proven).
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
            -o "$RUNNER_TEMP/Octo-1.11.0-android.apk" "$OFFICIAL_APK" \
            || { echo "::error::The official APK did not come down in five tries: $OFFICIAL_APK"; exit 1; }
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
            -o "$RUNNER_TEMP/SHA256SUMS" "${OFFICIAL_APK%/*}/SHA256SUMS" \
            || { echo "::error::The release's SHA256SUMS did not come down."; exit 1; }
          ( cd "$RUNNER_TEMP" && grep -F "Octo-1.11.0-android.apk" SHA256SUMS | sha256sum -c - ) \
            || { echo "::error::The official APK's hash does not match the release's SHA256SUMS."; exit 1; }
          adb install "$RUNNER_TEMP/Octo-1.11.0-android.apk" >/dev/null
          adb install app-patched.apk >/dev/null
          pkgs="$(adb shell pm list packages)"
          echo "$pkgs" | grep -Fx "package:app.winters.octo" \
            && echo "[W6] PASS: the official app.winters.octo is installed" \
            || { echo "[W6] FAIL: the official app.winters.octo is missing"; exit 1; }
          echo "$pkgs" | grep -Fx "package:app.winters.octo.patched" \
            && echo "[W6] PASS: app.winters.octo.patched is installed beside it" \
            || { echo "[W6] FAIL: app.winters.octo.patched is missing"; exit 1; }
          adb shell am start -n app.winters.octo/app.winters.octo.MainActivity >/dev/null \
            || { echo "::error::The official app would not start."; exit 1; }
          sleep 5
          official_xml="$(dump w6-official)"
          grep -q "Sign in" "$official_xml" \
            && echo "[W6] PASS: the official app starts, its own data untouched" \
            || { echo "[W6] FAIL: the official app did not reach its sign-in page."; shot w6-official-failed; exit 1; }
          adb shell am force-stop app.winters.octo
          shot w6-official
          touch "$RUNNER_TEMP/wtable.md"
          {
            echo "| W6 | PASS | official 1.11.0 and the patched APK installed side by side, no conflict |"
            echo "| W6 | PASS | pm list packages shows app.winters.octo and app.winters.octo.patched |"
            echo "| W6 | PASS | the official app still starts on its own sign-in page |"
          } >> "$RUNNER_TEMP/wtable.md"

      # The patched app signs in to the bridge: address, admin, password, and
      # the legacy sign-in switch -- the app's normal token sign-in meets the
      # same Navidrome quirk live-smoke worked around with enc: passwords: an
      # admin made by ND_DEVAUTOCREATEADMINPASSWORD cannot be token-checked.
      - name: Sign in to the bridge
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/brama-lib.sh"
          launch
          # The app opens on Home, not on the sign-in form: a permission
          # dialog may sit on top of it (run 43873688215's evidence shows
          # Allow / Not now over Home), and the form itself waits behind the
          # "Sign in to a server" button. Decline the dialog, tap the
          # button, and only then can the form's own heading appear.
          # Every tap and await below fails loudly, with a shot: run
          # 43877011581 left the step on a silent exit, with the form
          # filled and the server never asked anything.
          if await_text "Allow" 3; then
            tap_text "Not now" || { shot sign-in-dialog; echo "::error::The permission dialog's Not now could not be tapped."; exit 1; }
            sleep 1
          fi
          await_text "Sign in to a server" 30 || { shot sign-in-no-entry; echo "::error::Home's Sign in to a server entry never appeared."; exit 1; }
          tap_text "Sign in to a server" || { shot sign-in-entry; echo "::error::The Sign in to a server entry could not be tapped."; exit 1; }
          await_text "Sign in to your music server" 30 || { shot sign-in-no-form; echo "::error::The sign-in form never appeared."; exit 1; }

          type_into 0 "10.0.2.2:$OCTO_PORT" sign-in-address
          adb shell input keyevent 66
          # The address field offers https unless told otherwise; the bridge is plain http.
          if await_text "Encrypted, https" 3; then
            tap_text "Encrypted, https" || { shot sign-in-scheme; echo "::error::The scheme toggle could not be tapped."; exit 1; }
            sleep 1
          fi
          type_into 1 "admin" sign-in-user
          adb shell input keyevent 66
          type_into 2 "$BRAMA_PASS" sign-in-pass length
          # ESC alone did not always put the keyboard away (run 43893718824:
          # the Advanced fold stayed hidden behind it although its await
          # scrolled), and a swipe over an open keyboard scrolls nothing --
          # TAB walks the focus off the text field, which closes it.
          adb shell input keyevent 111
          adb shell input keyevent 61

          await_text "Advanced" 15 scroll || { shot sign-in-no-advanced; echo "::error::The form's Advanced fold never appeared."; exit 1; }
          tap_text "Advanced" || { shot sign-in-advanced; echo "::error::The Advanced fold could not be tapped."; exit 1; }
          sleep 1
          # Run 43877011581: with the keyboard up, this row sat below the
          # fold and off screen; the form scrolls, and the switch must be
          # found before it is flipped.
          await_text "Legacy sign-in" 15 scroll || { shot sign-in-no-legacy; echo "::error::The Legacy sign-in row never appeared."; exit 1; }
          toggle_beside "Legacy sign-in" || { shot sign-in-legacy; echo "::error::The Legacy sign-in switch could not be tapped."; exit 1; }
          sleep 1
          # The Legacy row sits below the middle, and reaching it left the
          # viewport low: the submit button now waits ABOVE the screen (run
          # 43949964546, where the on-screen filter rightly refused to tap).
          # Walk the form back up until the button itself is on screen --
          # clickable and all, not the app bar's title -- and then press it.
          up=""
          for i in 1 2 3; do
            dump submit-check >/dev/null
            cp "$RUNNER_TEMP/brama-dumps/submit-check.xml" "$RUNNER_TEMP/brama-dumps/tap.xml"
            if [ -n "$(nodes_with "Sign in" tap)" ]; then up=1; break; fi
            adb shell input swipe 540 600 540 1800 400
            sleep 1
          done
          [ -n "$up" ] || { shot sign-in-submit-offscreen; echo "::error::The Sign in button never came back into view."; exit 1; }

          rests_before="$(docker logs "$BRAMA_RUN-octo" 2>&1 | grep -c "GET /rest" || true)"
          tap_text "Sign in" || { shot sign-in-submit; echo "::error::The Sign in button could not be tapped."; exit 1; }
          gone=""
          for i in $(seq 1 60); do
            if ! await_text "Sign in to your music server" 1; then gone=1; break; fi
            sleep 2
          done
          if [ -z "$gone" ]; then
            shot sign-in-failed
            check S "sign in to the bridge" "signed in" "$(screen_texts sign-in-failed | head -40 | tr '\n' ';')"
            verdict S
          fi
          # Home's tab lives in the bottom bar of every screen and witnessed
          # nothing (run 43933032189 passed on it while the form still
          # stood). The page's own witness is "Edit Home": it shows only on
          # a signed-in Home with content (run 43954188181's dumps: the
          # signed-in page has it, the empty one says "Music on this phone"
          # instead).
          await_text "Edit Home" 20 || true
          shot signed-in
          check S "the patched app signed in to the bridge" "Edit Home" "$(screen_texts signed-in | grep -m1 "Edit Home" || echo none)"

          # And the bridge heard it: only what the sign-in itself moved. A
          # log that carries no request lines at all says nothing either
          # way, and is said so.
          sleep 5
          rests_after="$(docker logs "$BRAMA_RUN-octo" 2>&1 | grep -c "GET /rest" || true)"
          if [ "$rests_after" -gt 0 ] || [ "$rests_before" -gt 0 ]; then
            moved=$((rests_after - rests_before))
            if [ "$moved" -ge 1 ]; then
              PASS=$((PASS+1)); echo "[S] PASS: the bridge heard the sign-in ($moved new /rest requests)"
              echo "| S | PASS | the bridge heard the sign-in ($moved new /rest requests) |" >> "$RUNNER_TEMP/wtable.md"
            else
              FAIL=$((FAIL+1)); echo "[S] FAIL: the bridge heard nothing new (before $rests_before, after $rests_after)"
              echo "| S | FAIL | the bridge heard nothing new |" >> "$RUNNER_TEMP/wtable.md"
            fi
          else
            echo "::notice::This server's log carries no request lines; the Home heading alone witnesses the sign-in."
          fi

          # New playlists must reach the server for the walk's probes: the
          # app keeps one it makes on the phone alone until this switch is
          # on (PlaylistSync.created reads it before anything is sent), and
          # playlists on the server are the whole point of the patch. The
          # user sets it once, right after signing in (run 44080662051: the
          # app made "Znalezione" beautifully, and the server never heard of
          # it).
          tap_text "Settings" || { shot s-settings; echo "::error::The Settings tab could not be tapped."; exit 1; }
          await_text "Server and sync" 15 scroll \
            || { shot s-no-server-page; echo "::error::Settings never listed Server and sync."; exit 1; }
          tap_text "Server and sync" || { shot s-server-page; echo "::error::The Server and sync entry could not be tapped."; exit 1; }
          sleep 2
          await_text "Save new playlists to the server" 15 scroll \
            || { shot s-no-playlists-switch; echo "::error::The server page never listed the playlists switch."; exit 1; }
          # The helper flips at most once per look and proves the state from
          # its own dumps; this step only reads the answer (run 44098011463:
          # the step's own second flip undid the first).
          sw="$(switch_on_beside "Save new playlists to the server")"
          if [ "$sw" = "fail" ]; then
            shot s-playlists-switch
            echo "::error::The playlists switch never turned on."
            exit 1
          elif [ -z "$sw" ]; then
            shot s-playlists-switch
            echo "::error::The Save new playlists to the server switch was not found."
            exit 1
          fi
          shot s-playlists-switch-on
          check S "new playlists will be made on the server" "on" "${sw:-none}"
          back_to_main || { shot s-no-main; echo "::error::Could not get back to the main shell after the switch."; exit 1; }
          verdict S

      # W1 (R1, a new playlist): search answers an outside song through the
      # bridge, its menu offers Add to playlist, a new playlist named
      # Znalezione takes it, the app renders the row, and the server's
      # getPlaylist -- after the sync's 1.5 s debounce and a 10 s margin --
      # holds the outside song.
      - name: W1 - a found song into a new playlist
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/brama-lib.sh"
          search_for Mozart
          await_text "$F1_TITLE" 15 scroll || true   # found rows ride discovery, which can be slow
          check W1 "the search answers the found song" "$F1_TITLE" "$(screen_texts w1-search | grep -F "$F1_TITLE" || echo none)"
          open_menu_on_row "$F1_TITLE" || { shot w1-no-menu; echo "::error::No menu opened on the found row."; exit 1; }
          await_text "Add to playlist" 10 || { shot w1-menu; echo "::error::The found song's menu offers no Add to playlist."; exit 1; }
          check W1 "the found song's menu offers Add to playlist" "Add to playlist" "$(screen_texts w1-menu | grep -m1 "Add to playlist" || echo none)"
          tap_text "Add to playlist" || { shot w1-add; echo "::error::The Add to playlist could not be tapped."; exit 1; }; sleep 2
          # The picker lists the playlists and its New playlist action, and
          # the action opens the naming dialog (run 18's dump read the
          # dialog because a tap had already gone through; run 19's shows
          # the picker whole). Picker first, then the action, then the
          # dialog's own field marker.
          await_text "New playlist" 10 scroll \
            || { shot w1-no-picker; echo "::error::The picker's New playlist never appeared."; exit 1; }
          tap_text "New playlist" || { shot w1-newplaylist; echo "::error::The New playlist action could not be tapped."; exit 1; }
          await_text "Playlist name" 10 \
            || { shot w1-no-dialog; echo "::error::The playlist naming dialog never appeared."; exit 1; }
          type_into 0 "Znalezione" w1-name
          # The field must still hold the name when Create is reached (run
          # 44008986015: typing had been proven, and the field stood empty
          # by the button anyway -- the keyboard keys between the two had
          # cleared it). One retype, then the word.
          dump typecheck >/dev/null
          s="$(edit_state 0)"
          if [ -z "${s#* }" ]; then
            type_into 0 "Znalezione" w1-retype
          fi
          dump typecheck >/dev/null
          s="$(edit_state 0)"
          [ -n "${s#* }" ] || { shot w1-field-lost; echo "::error::The name field stood empty at Create."; exit 1; }
          # The dialog relayouts once the keyboard is gone, and Create can end
          # below the screen (run 43996895386: a bare tap then died in
          # silence). Walk it back into view, then press it.
          up=""
          for i in 1 2 3; do
            dump create-check >/dev/null
            cp "$RUNNER_TEMP/brama-dumps/create-check.xml" "$RUNNER_TEMP/brama-dumps/tap.xml"
            if [ -n "$(nodes_with "Create" tap)" ]; then up=1; break; fi
            if [ -n "$(nodes_with "Create" read-onscreen)" ]; then
              sleep 2   # visible but disabled: the field fills, it wakes
            else
              adb shell input swipe 540 600 540 1800 400
              sleep 1
            fi
          done
          [ -n "$up" ] || { shot w1-create-offscreen; echo "::error::The Create button never came into view."; exit 1; }
          tap_text "Create" || { shot w1-create; echo "::error::The Create button could not be tapped."; exit 1; }; sleep 3
          shot w1-created

          open_playlists
          await_text "Znalezione" 15 scroll || true
          check W1 "the playlists page renders Znalezione" "Znalezione" "$(screen_texts w1-list | grep -m1 Znalezione || echo none)"
          tap_text "Znalezione" || { shot w1-open; echo "::error::The Znalezione could not be tapped."; exit 1; }; sleep 3
          await_text "$F1_TITLE" 15 scroll || true
          check W1 "the playlist renders the found song" "$F1_TITLE" "$(screen_texts w1-open | grep -F "$F1_TITLE" || echo none)"
          shot w1-playlist

          PID="$(await_id Znalezione)"
          [ -n "$PID" ] && check W1 "getPlaylist answers the new playlist" "id" "id $PID" \
            || check W1 "getPlaylist answers the new playlist" "id" "none"
          check W1 "the server holds the found song after sync" "1" "$(await_count 1 playlist_external_count "${PID:-none}")"
          verdict W1

      # W2 (R1, an existing playlist): the same menu, an existing library
      # playlist picked from the page, and the row lands on both ends.
      - name: W2 - a found song into an existing playlist
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/brama-lib.sh"
          search_for Mozart
          open_menu_on_row "$F1_TITLE" || { shot w2-no-menu; echo "::error::No menu opened on the found row."; exit 1; }
          await_text "Add to playlist" 10 || { shot w2-no-add; echo "::error::The menu offers no Add to playlist."; exit 1; }
          tap_text "Add to playlist" || { shot w2-add; echo "::error::The Add to playlist could not be tapped."; exit 1; }; sleep 2
          await_text "$W2_NAME" 15 scroll || true
          check W2 "the picker lists the existing library playlist" "$W2_NAME" "$(screen_texts w2-picker | grep -m1 "$W2_NAME" || echo none)"
          tap_text "$W2_NAME" || { shot w2-open-row; echo "::error::The playlist row could not be tapped."; exit 1; }
          shot w2-added
          check W2 "the server playlist grew to three songs" "3" "$(await_count 3 playlist_entry_count "$W2_ID")"
          # No walk home here: the picker returns to the search screen with
          # the bottom bar in place (run 44107088523's dump), and W1 proved
          # open_playlists from exactly that state -- the extra Home hop of
          # run 44101841939's fix only added a second animation to lose a
          # tap in.
          open_playlists
          await_text "$W2_NAME" 15 scroll \
            || { shot w2-no-row; echo "::error::The picker never listed the existing playlist."; exit 1; }
          tap_text "$W2_NAME" || { shot w2-row; echo "::error::The row could not be tapped."; exit 1; }; sleep 3
          await_text "$F1_TITLE" 15 scroll || true
          check W2 "the existing playlist renders the found song" "$F1_TITLE" "$(screen_texts w2-open | grep -F "$F1_TITLE" || echo none)"
          shot w2-playlist
          verdict W2

      # W3 (R2): two library rows and two found rows, selected together in
      # one search answer, landed in a new playlist by one action. A plain
      # tap on a row plays it; the only road into a selection is the row
      # menu's Select action (SongMenuPopup's single selection.start), so
      # that starts the picking, and every later tap adds its row to it.
      - name: W3 - a mixed selection into one playlist
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/brama-lib.sh"
          W3_NAME="Mieszana $BRAMA_RUN"
          search_for Mozart
          await_text "Mozart Bridge One" 15 scroll || true
          open_menu_on_row "Mozart Bridge One" || { shot w3-no-menu; echo "::error::No menu opened on the first library row."; exit 1; }
          await_text "Select" 10 || { shot w3-no-select; echo "::error::The row's menu offers no Select action."; exit 1; }
          tap_text "Select" || { shot w3-select; echo "::error::The Select could not be tapped."; exit 1; }; sleep 2
          tap_text "Mozart Bridge Two" || { shot w3-lib2; echo "::error::The Mozart Bridge Two could not be tapped."; exit 1; }; sleep 1
          tap_text "$F1_TITLE" || { shot w3-f1; echo "::error::The row could not be tapped."; exit 1; }; sleep 1
          tap_text "$F2_TITLE" || { shot w3-f2; echo "::error::The row could not be tapped."; exit 1; }; sleep 1
          shot w3-selected
          await_text "Add to playlist" 10 || { shot w3-no-bar; echo "::error::The selection bar did not appear."; exit 1; }
          check W3 "the selection bar offers Add to playlist" "Add to playlist" "$(screen_texts w3-bar | grep -m1 "Add to playlist" || echo none)"
          tap_text "Add to playlist" || { shot w3-add; echo "::error::The Add to playlist could not be tapped."; exit 1; }; sleep 2
          # The picker lists the playlists and its New playlist action, and
          # the action opens the naming dialog (run 18's dump read the
          # dialog because a tap had already gone through; run 19's shows
          # the picker whole). Picker first, then the action, then the
          # dialog's own field marker.
          await_text "New playlist" 10 scroll \
            || { shot w3-no-picker; echo "::error::The picker's New playlist never appeared."; exit 1; }
          tap_text "New playlist" || { shot w3-newplaylist; echo "::error::The New playlist action could not be tapped."; exit 1; }
          await_text "Playlist name" 10 \
            || { shot w3-no-dialog; echo "::error::The playlist naming dialog never appeared."; exit 1; }
          type_into 0 "$W3_NAME" w3-name
          # The field must still hold the name when Create is reached (run
          # 44008986015: typing had been proven, and the field stood empty
          # by the button anyway -- the keyboard keys between the two had
          # cleared it). One retype, then the word.
          dump typecheck >/dev/null
          s="$(edit_state 0)"
          if [ -z "${s#* }" ]; then
            type_into 0 "$W3_NAME" w3-retype
          fi
          dump typecheck >/dev/null
          s="$(edit_state 0)"
          [ -n "${s#* }" ] || { shot w3-field-lost; echo "::error::The name field stood empty at Create."; exit 1; }
          # The dialog relayouts once the keyboard is gone, and Create can end
          # below the screen (run 43996895386: a bare tap then died in
          # silence). Walk it back into view, then press it.
          up=""
          for i in 1 2 3; do
            dump create-check >/dev/null
            cp "$RUNNER_TEMP/brama-dumps/create-check.xml" "$RUNNER_TEMP/brama-dumps/tap.xml"
            if [ -n "$(nodes_with "Create" tap)" ]; then up=1; break; fi
            if [ -n "$(nodes_with "Create" read-onscreen)" ]; then
              sleep 2   # visible but disabled: the field fills, it wakes
            else
              adb shell input swipe 540 600 540 1800 400
              sleep 1
            fi
          done
          [ -n "$up" ] || { shot w3-create-offscreen; echo "::error::The Create button never came into view."; exit 1; }
          tap_text "Create" || { shot w3-create; echo "::error::The Create button could not be tapped."; exit 1; }
          shot w3-created
          PID="$(await_id "$W3_NAME")"
          [ -n "$PID" ] && check W3 "getPlaylist answers the mixed playlist" "id" "id $PID" \
            || check W3 "getPlaylist answers the mixed playlist" "id" "none"
          check W3 "four rows landed by one action" "4" "$(await_count 4 playlist_entry_count "${PID:-none}")"
          check W3 "two of them are found songs" "2" "$(await_count 2 playlist_external_count "${PID:-none}")"
          verdict W3

      # W4 (R3): on a found song the menu names the last playlist and takes
      # the song straight into it, without the picker.
      - name: W4 - the last playlist on a found song
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/brama-lib.sh"
          W3_NAME="Mieszana $BRAMA_RUN"
          search_for Mozart
          open_menu_on_row "$F1_TITLE" || { shot w4-no-menu; echo "::error::No menu opened on the found row."; exit 1; }
          await_text "Add to last playlist" 10 \
            || { shot w4-no-last; echo "::error::The menu offers no Add to last playlist."; exit 1; }
          check W4 "the menu names the last playlist" "Add to last playlist: $W3_NAME" \
            "$(screen_texts w4-menu | grep -m1 "Add to last playlist" || echo none)"
          tap_text "Add to last playlist" || { shot w4-last; echo "::error::The Add to last playlist action could not be tapped."; exit 1; }
          shot w4-done
          PID="$(await_id "$W3_NAME")"
          check W4 "the last playlist grew to five songs, no picker opened" "5" "$(await_count 5 playlist_entry_count "${PID:-none}")"
          verdict W4

      # W5 (R4): play a library tone, push two found songs in as Play next,
      # and the queue saved as a playlist keeps every row, the found ones too.
      - name: W5 - the queue as a playlist, finds kept
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/brama-lib.sh"
          W5_NAME="Kolejka$BRAMA_RUN"
          search_for Mozart
          await_text "Mozart Bridge One" 15 scroll || true
          tap_text "Mozart Bridge One" || { shot w5-lib1; echo "::error::The Mozart Bridge One could not be tapped."; exit 1; }; sleep 4   # plays, so the player and its queue exist
          open_menu_on_row "$F1_TITLE" || { shot w5-no-menu; echo "::error::No menu opened on the row."; exit 1; }
          await_text "Play next" 10 || { shot w5-no-playnext; echo "::error::The menu offers no Play next."; exit 1; }
          tap_text "Play next" || { shot w5-playnext; echo "::error::The Play next could not be tapped."; exit 1; }; sleep 2
          open_menu_on_row "$F2_TITLE" || { shot w5-no-menu; echo "::error::No menu opened on the row."; exit 1; }
          await_text "Play next" 10 || { shot w5-no-playnext; echo "::error::The menu offers no Play next."; exit 1; }
          tap_text "Play next" || { shot w5-playnext; echo "::error::The Play next could not be tapped."; exit 1; }; sleep 2
          adb shell input keyevent 111   # the keyboard must not cover the player
          shot w5-before-player

          tap_bottom; sleep 2            # the now playing bar opens the player
          shot w5-player
          await_text "Up next" 8 || tap_bottom
          tap_text "Up next" || { shot w5-upnext; echo "::error::The Up next could not be tapped."; exit 1; }; sleep 2
          shot w5-queue
          await_text "More" 10 || { shot w5-no-more; echo "::error::The queue sheet's More never appeared."; exit 1; }
          tap_text "More" || { shot w5-more; echo "::error::The More could not be tapped."; exit 1; }; sleep 2
          await_text "Save as playlist" 10 \
            || { shot w5-no-save; echo "::error::The More menu offers no Save as playlist."; exit 1; }
          tap_text "Save as playlist" || { shot w5-save; echo "::error::The Save as playlist could not be tapped."; exit 1; }; sleep 2
          type_into 0 "$W5_NAME" w5-name
          # The field must still hold the name when Create is reached (run
          # 44008986015: typing had been proven, and the field stood empty
          # by the button anyway -- the keyboard keys between the two had
          # cleared it). One retype, then the word.
          dump typecheck >/dev/null
          s="$(edit_state 0)"
          if [ -z "${s#* }" ]; then
            type_into 0 "$W5_NAME" w5-retype
          fi
          dump typecheck >/dev/null
          s="$(edit_state 0)"
          [ -n "${s#* }" ] || { shot w5-field-lost; echo "::error::The name field stood empty at Create."; exit 1; }
          # The dialog relayouts once the keyboard is gone, and Create can end
          # below the screen (run 43996895386: a bare tap then died in
          # silence). Walk it back into view, then press it.
          up=""
          for i in 1 2 3; do
            dump create-check >/dev/null
            cp "$RUNNER_TEMP/brama-dumps/create-check.xml" "$RUNNER_TEMP/brama-dumps/tap.xml"
            if [ -n "$(nodes_with "Create" tap)" ]; then up=1; break; fi
            if [ -n "$(nodes_with "Create" read-onscreen)" ]; then
              sleep 2   # visible but disabled: the field fills, it wakes
            else
              adb shell input swipe 540 600 540 1800 400
              sleep 1
            fi
          done
          [ -n "$up" ] || { shot w5-create-offscreen; echo "::error::The Create button never came into view."; exit 1; }
          tap_text "Create" || { shot w5-create; echo "::error::The Create button could not be tapped."; exit 1; }
          shot w5-saved
          PID="$(await_id "$W5_NAME")"
          [ -n "$PID" ] && check W5 "getPlaylist answers the queue's playlist" "id" "id $PID" \
            || check W5 "getPlaylist answers the queue's playlist" "id" "none"
          check W5 "the queue's three rows all landed" "3" "$(await_count 3 playlist_entry_count "${PID:-none}")"
          check W5 "the found rows landed with them" "2" "$(await_count 2 playlist_external_count "${PID:-none}")"
          verdict W5

      # W7 (R6): the About page says why the updater sleeps, and the session's
      # log holds no line of an update attempt. The step backs out of what
      # W5 leaves open -- the player hides the bottom bar, the only road to
      # Settings -- without killing the app (a kill threw the session away
      # once already).
      - name: W7 - the updater asleep
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/brama-lib.sh"
          back_to_main || { shot w7-no-shell; echo "::error::Could not get back to the main shell for Settings."; exit 1; }
          tap_text "Settings" || { shot w7-settings; echo "::error::The Settings could not be tapped."; exit 1; }; sleep 2
          await_text "About" 15 scroll \
            || { shot w7-no-about; echo "::error::Settings never listed About."; exit 1; }
          tap_text "About" || { shot w7-about; echo "::error::The About could not be tapped."; exit 1; }; sleep 2
          await_text "patched build" 10 scroll || true
          check W7 "About says the patched build does not update itself" \
            "This is a patched build, so it doesn't update itself." \
            "$(screen_texts w7-about | grep -m1 "patched build" || echo none)"
          shot w7-about
          UPDATES="$(adb logcat -d | grep -E "update refused|update install ended|is out\.|releases\.json|Checking for update" | grep -v "doesn't update" || true)"
          check W7 "no update attempt anywhere in the session's log" "nothing" "${UPDATES:-nothing}"
          verdict W7

      # W8 (R7+R8): a rename with ogonki and an emoji, the family playlist
      # round trip, and the boundary of the whole patch. adb's input text
      # cannot type an emoji, so the renamed name is sent through the same
      # updatePlaylist call every Subsonic client sends, and the app's part is
      # rendering what came back; the family playlist is created and filled
      # from the app itself, renamed through the client call. The family
      # assertions read the row's shape -- the name as the server answers it,
      # the rest after the #family prefix, under owner Family -- not a name
      # with the prefix baked in.
      - name: W8 - the rename, the family playlist, the boundary
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/brama-lib.sh"
          RENAMED="Załóżne ✨ źródła ó"
          ZID="$(playlist_id_by_name Znalezione)"

          curl -fsS "$BRAMA_BASE/rest/updatePlaylist.view?playlistId=$(urlenc "$ZID")&name=$(urlenc "$RENAMED")&$BRAMA_AUTH" \
            | jq -e '.["subsonic-response"].status == "ok"' >/dev/null
          check W8 "the server holds the renamed name" "$RENAMED" \
            "$(sub "getPlaylist.view?id=$(urlenc "$ZID")&" | jq -r '.["subsonic-response"].playlist.name')"

          launch
          open_playlists
          await_text "Załóżne" 20 scroll || true
          check W8 "the app renders the ogonki and the emoji" "źródła ó" "$(screen_texts w8-render | grep -m1 "źródła ó" || echo none)"
          shot w8-renamed

          # The family round trip: created from the app with the #family
          # prefix (a plain # and letters, which adb can type), filled from
          # the app, renamed through the client call. Names carry the run id,
          # so no two gates ever meet each other's family playlists.
          BARE="Brama $BRAMA_RUN"
          search_for Mozart
          open_menu_on_row "$F1_TITLE" || { shot w8-no-menu; echo "::error::No menu opened on the found row."; exit 1; }
          await_text "Add to playlist" 10 || { shot w8-no-add; echo "::error::The menu offers no Add to playlist."; exit 1; }
          tap_text "Add to playlist" || { shot w8-add; echo "::error::The Add to playlist could not be tapped."; exit 1; }; sleep 2
          # The picker lists the playlists and its New playlist action, and
          # the action opens the naming dialog (run 18's dump read the
          # dialog because a tap had already gone through; run 19's shows
          # the picker whole). Picker first, then the action, then the
          # dialog's own field marker.
          await_text "New playlist" 10 scroll \
            || { shot w8-no-picker; echo "::error::The picker's New playlist never appeared."; exit 1; }
          tap_text "New playlist" || { shot w8-newplaylist; echo "::error::The New playlist action could not be tapped."; exit 1; }
          await_text "Playlist name" 10 \
            || { shot w8-no-dialog; echo "::error::The playlist naming dialog never appeared."; exit 1; }
          type_into 0 "#family Brama $BRAMA_RUN" w8-family-name
          # The field must still hold the name when Create is reached (run
          # 44008986015: typing had been proven, and the field stood empty
          # by the button anyway -- the keyboard keys between the two had
          # cleared it). One retype, then the word.
          dump typecheck >/dev/null
          s="$(edit_state 0)"
          if [ -z "${s#* }" ]; then
            type_into 0 "#family Brama $BRAMA_RUN" w8-retype
          fi
          dump typecheck >/dev/null
          s="$(edit_state 0)"
          [ -n "${s#* }" ] || { shot w8-field-lost; echo "::error::The name field stood empty at Create."; exit 1; }
          # The dialog relayouts once the keyboard is gone, and Create can end
          # below the screen (run 43996895386: a bare tap then died in
          # silence). Walk it back into view, then press it.
          up=""
          for i in 1 2 3; do
            dump create-check >/dev/null
            cp "$RUNNER_TEMP/brama-dumps/create-check.xml" "$RUNNER_TEMP/brama-dumps/tap.xml"
            if [ -n "$(nodes_with "Create" tap)" ]; then up=1; break; fi
            if [ -n "$(nodes_with "Create" read-onscreen)" ]; then
              sleep 2   # visible but disabled: the field fills, it wakes
            else
              adb shell input swipe 540 600 540 1800 400
              sleep 1
            fi
          done
          [ -n "$up" ] || { shot w8-create-offscreen; echo "::error::The Create button never came into view."; exit 1; }
          tap_text "Create" || { shot w8-create; echo "::error::The Create button could not be tapped."; exit 1; }
          shot w8-family-created

          FID="$(await_id "$BARE")"
          [ -n "$FID" ] && check W8 "the #family create was captured as a family playlist (of-id)" "of" "${FID:0:2}" \
            || check W8 "the #family create was captured as a family playlist (of-id)" "of" "none"
          # The family row's shape, not a name with the prefix in it: the
          # server answers the rest after #family, under the family's owner.
          FAMROW="$(sub "getPlaylists.view?" | jq -c --arg n "$BARE" '[.["subsonic-response"].playlists.playlist[]? | select(.name == $n)][0] // empty')"
          check W8 "the family playlist's name is the rest after the #family prefix" "$BARE" "$(jq -r '.name // empty' <<<"$FAMROW")"
          check W8 "the family playlist belongs to the family (owner Family)" "Family" "$(jq -r '.owner // empty' <<<"$FAMROW")"

          search_for Mozart
          open_menu_on_row "$F2_TITLE" || { shot w8-no-menu; echo "::error::No menu opened on the found row."; exit 1; }
          await_text "Add to playlist" 10 || { shot w8-no-add; echo "::error::The menu offers no Add to playlist."; exit 1; }
          tap_text "Add to playlist" || { shot w8-add; echo "::error::The Add to playlist could not be tapped."; exit 1; }; sleep 2
          await_text "$BARE" 15 scroll \
            || { shot w8-no-family-row; echo "::error::The picker never listed the family playlist."; exit 1; }
          check W8 "the picker lists the family playlist" "$BARE" "$(screen_texts w8-picker | grep -m1 "$BARE" || echo none)"
          tap_text "$BARE" || { shot w8-family-tap; echo "::error::The family playlist row could not be tapped."; exit 1; }
          check W8 "the family playlist took the added song" "1" "$(await_count 1 playlist_entry_count "${FID:-none}")"

          curl -fsS "$BRAMA_BASE/rest/updatePlaylist.view?playlistId=$(urlenc "$FID")&name=$(urlenc "#family $BARE dwa")&$BRAMA_AUTH" \
            | jq -e '.["subsonic-response"].status == "ok"' >/dev/null
          check W8 "the family rename sticks" "$BARE dwa" \
            "$(sub "getPlaylist.view?id=$(urlenc "$FID")&" | jq -r '.["subsonic-response"].playlist.name')"

          LEAKS="$(git diff --name-only origin/main..HEAD | grep -E "^subsonic/|^app/src/main/java/app/winters/octo/playlists/|^app/src/main/java/app/winters/octo/catalog/" || true)"
          check W8 "the patch touches no subsonic, playlist or catalog layer" "nothing" "${LEAKS:-nothing}"
          shot w8-done
          verdict W8

      - name: The gate's verdict
        if: always()
        run: |
          {
            echo "### The Brama's walk (W1-W8)"
            echo
            echo "| Step | Verdict | What was proven |"
            echo "|---|---|---|"
            cat "$RUNNER_TEMP/wtable.md" 2>/dev/null || echo "| - | - | no step wrote a verdict; the run failed before the walk began |"
            echo
            echo "**Boundary:** playing a found song is not proven on this runner -- a datacenter"
            echo "IP always meets YouTube's bot wall (the live-smoke chronicle). The gate proves"
            echo "the find lands, renders and syncs; playback belongs to the SOAK on the"
            echo "Admiral's phone, on a residential IP."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/brama-shots" "$RUNNER_TEMP/brama-dumps"
          # Evidence must never hang the job: this step runs even when the
          # emulator or the bridge is long dead, and adb against a dead
          # device sat here for most of an hour (run 43858067710). Every
          # command gets its own deadline and its failure is fine.
          timeout 30 adb logcat -d > "$RUNNER_TEMP/brama-dumps/logcat.txt" 2>/dev/null || true
          for c in "$BRAMA_RUN-octo" "$BRAMA_RUN-navidrome" "$BRAMA_RUN-shim"; do
            timeout 30 docker logs "$c" > "$RUNNER_TEMP/brama-dumps/$c.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: brama-evidence
          path: |
            ${{ runner.temp }}/brama-shots/
            ${{ runner.temp }}/brama-dumps/
            ${{ runner.temp }}/emulator.log
          if-no-files-found: warn
